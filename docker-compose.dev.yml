# Dev overlay: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Backend hot-reloads via nodemon (polling, works over Windows bind mounts).
# UI hot-reloads via Vite dev server on http://localhost:5173 (API proxied to the backend).
services:
  amnezia-wg-easy:
    build: .
    volumes:
      - ./src:/app
      - etc_wireguard:/etc/wireguard
    command: ["/usr/bin/dumb-init", "sh", "-c", "test -d node_modules/nodemon || npm install --no-audit --no-fund; npx nodemon --legacy-watch server.js"]

  ui:
    image: node:24-alpine
    working_dir: /ui
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      - API_TARGET=http://amnezia-wg-easy:${PORT:-51821}
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./src/www:/ui
      - /ui/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - amnezia-wg-easy
