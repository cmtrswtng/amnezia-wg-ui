name: Build & Publish Latest

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        ref: master

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          src/package-lock.json
          src/www/package-lock.json

    - run: npm ci --prefix src
    - run: npm --prefix src test
    - run: npm --prefix src run lint

    - run: npm ci --prefix src/www
    - run: npm --prefix src/www test
    - run: npx --prefix src/www playwright install --with-deps chromium
    - run: npm --prefix src/www run test:e2e

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build AMD64 image for AWG smoke testing
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: amnezia-wg-ui:awg31-smoke

    - name: Verify independent installer instances
      run: |
        docker run --rm --env AWG_INSTALLER_TEST_CONTAINER=1 \
          --mount type=bind,source="${{ github.workspace }}",target=/workspace,readonly \
          --entrypoint bash amnezia-wg-ui:awg31-smoke /workspace/scripts/test-installer.sh

    - name: Verify AWG tooling
      run: docker run --rm --entrypoint sh amnezia-wg-ui:awg31-smoke -c "command -v amneziawg-go && wg --version && command -v wg-quick && node --version"

    - name: Load host netfilter modules for the tunnel test
      run: |
        sudo modprobe iptable_filter
        sudo modprobe iptable_nat

    - name: Verify fresh, migrated and restored AWG tunnels and DNS
      run: timeout 120s bash scripts/smoke-awg31.sh amnezia-wg-ui:awg31-smoke

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set environment variables
      run: echo RELEASE=$(cat ./src/package.json | jq -r .release | jq -r .version) >> $GITHUB_ENV

    - name: Build & Publish Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64
        tags: ghcr.io/${{ github.repository }}:latest, ghcr.io/${{ github.repository }}:${{ env.RELEASE }}
